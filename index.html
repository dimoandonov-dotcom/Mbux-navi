<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050810">
<title>MBUX · Навигация</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg-deep:#0a1428;
  --bg-deep-2:#121e3a;
  --panel:rgba(14,22,42,0.74);
  --panel-strong:rgba(10,18,36,0.92);
  --stroke:rgba(255,255,255,0.10);
  --stroke-strong:rgba(0,210,223,0.40);
  --cyan:#00D2DF;
  --cyan-2:#5BE6EE;
  --cyan-soft:rgba(0,210,223,0.20);
  --white:#ffffff;
  --text-2:#9eaac0;
  --text-3:#6a7588;
  --amber:#FFB300;
  --red:#FF3B30;
  --ring:152px;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{
  height:100%;width:100%;overflow:hidden;
  background:var(--bg-deep);
  font-family:'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
  font-weight:500;color:var(--white);
  letter-spacing:-0.01em;user-select:none;-webkit-user-select:none;
}

#map{position:fixed;inset:0;background:var(--bg-deep);}
.maplibregl-control-container{display:none;}
#map::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:1;
  background:
    radial-gradient(120% 80% at 50% 0%, transparent 50%, rgba(0,0,0,0.55) 100%),
    radial-gradient(120% 80% at 50% 100%, transparent 55%, rgba(0,0,0,0.65) 100%);
}
.ambient{
  position:fixed;pointer-events:none;z-index:2;
  inset:auto 0 -20% 0;height:60%;
  background:radial-gradient(60% 60% at 50% 100%, rgba(0,210,223,0.10), transparent 70%);
}

/* TOP BAR */
.top-bar{position:fixed;top:14px;left:14px;right:14px;z-index:10;display:flex;align-items:center;gap:12px;}
.search{
  flex:1;height:64px;
  background:var(--panel);
  backdrop-filter:blur(20px) saturate(150%);
  -webkit-backdrop-filter:blur(20px) saturate(150%);
  border:1px solid var(--stroke);
  border-radius:20px;
  display:flex;align-items:center;padding:0 22px;gap:16px;
  box-shadow:0 8px 32px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.04);
  transition:border-color .25s ease, box-shadow .25s ease;
}
.search:focus-within{
  border-color:var(--stroke-strong);
  box-shadow:0 8px 32px rgba(0,0,0,0.45), 0 0 0 4px var(--cyan-soft), inset 0 1px 0 rgba(255,255,255,0.04);
}
.search svg{width:24px;height:24px;color:var(--cyan);flex-shrink:0;}
.search input{flex:1;background:transparent;border:none;outline:none;color:var(--white);font:500 19px/1 'Manrope';letter-spacing:-0.01em;}
.search input::placeholder{color:var(--text-2);font-weight:400;}

.chip-btn{
  height:64px;min-width:64px;padding:0 16px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  background:var(--panel);
  backdrop-filter:blur(20px) saturate(150%);
  -webkit-backdrop-filter:blur(20px) saturate(150%);
  border:1px solid var(--stroke);
  border-radius:20px;color:var(--white);cursor:pointer;
  box-shadow:0 8px 32px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.04);
  transition:transform .15s ease, border-color .2s;
}
.chip-btn:active{transform:scale(0.96);}
.chip-btn.on{border-color:var(--stroke-strong);color:var(--cyan);}
.chip-btn svg{width:26px;height:26px;}

.status-cluster{display:flex;align-items:center;gap:12px;height:64px;padding:0 20px;background:var(--panel);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);border:1px solid var(--stroke);border-radius:20px;box-shadow:0 8px 32px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.04);}
.status-time{font:600 20px/1 'Manrope';letter-spacing:-0.02em;font-variant-numeric:tabular-nums;}
.status-bars{display:flex;gap:2px;align-items:flex-end;}
.status-bars i{width:4px;background:var(--cyan);border-radius:1px;display:block;}
.status-bars i:nth-child(1){height:6px;}
.status-bars i:nth-child(2){height:10px;}
.status-bars i:nth-child(3){height:13px;}
.status-bars i:nth-child(4){height:16px;opacity:.35;}

/* LEFT RAIL */
.left-rail{position:fixed;left:14px;top:50%;transform:translateY(-50%);z-index:10;display:flex;flex-direction:column;gap:10px;background:var(--panel);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);border:1px solid var(--stroke);border-radius:24px;padding:10px;box-shadow:0 8px 32px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.04);}
.rail-btn{width:56px;height:56px;border:none;border-radius:16px;background:transparent;color:var(--white);display:grid;place-items:center;cursor:pointer;transition:background .2s ease, color .2s ease, transform .15s ease;}
.rail-btn:hover{background:rgba(255,255,255,0.05);}
.rail-btn:active{transform:scale(0.94);}
.rail-btn.active{background:var(--cyan-soft);color:var(--cyan);}
.rail-btn svg{width:26px;height:26px;}
.rail-divider{height:1px;background:var(--stroke);margin:2px 8px;}

/* SPEED + LIMIT */
.speed-cluster{position:fixed;left:14px;bottom:18px;z-index:10;display:flex;align-items:flex-end;gap:16px;}
.speed-ring{width:var(--ring);height:var(--ring);position:relative;display:grid;place-items:center;}
.speed-ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);}
.speed-ring .track{fill:none;stroke:rgba(255,255,255,0.06);stroke-width:3;}
.speed-ring .fill{
  fill:none;stroke:url(#speedGrad);stroke-width:3;stroke-linecap:round;
  stroke-dasharray:340;stroke-dashoffset:340;
  transition:stroke-dashoffset .4s cubic-bezier(.2,.8,.2,1);
  filter:drop-shadow(0 0 6px rgba(0,210,223,0.6));
}
.speed-inner{width:calc(var(--ring) - 24px);height:calc(var(--ring) - 24px);border-radius:50%;background:radial-gradient(circle at 50% 30%, rgba(0,210,223,0.10), rgba(8,12,24,0.95) 70%);border:1px solid var(--stroke);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 0 24px rgba(0,210,223,0.06);}
.speed-val{font:300 52px/1 'Manrope';letter-spacing:-0.04em;font-variant-numeric:tabular-nums;color:var(--white);text-shadow:0 0 18px rgba(0,210,223,0.4);}
.speed-unit{font:500 11px/1 'Manrope';letter-spacing:0.18em;color:var(--text-2);margin-top:7px;text-transform:uppercase;}

.speed-limit{width:84px;height:84px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;font:800 32px/1 'Manrope';letter-spacing:-0.03em;border:7px solid #d40000;box-shadow:0 8px 24px rgba(0,0,0,0.6), 0 0 0 2px rgba(255,255,255,0.1);margin-bottom:28px;font-variant-numeric:tabular-nums;}
.speed-limit.warning{animation:limitWarn 0.6s ease-in-out infinite alternate;}
@keyframes limitWarn{from{box-shadow:0 8px 24px rgba(0,0,0,0.6), 0 0 0 2px rgba(255,255,255,0.1);}to{box-shadow:0 8px 24px rgba(255,0,0,0.6), 0 0 0 4px rgba(255,59,48,0.5);}}

/* ROUTE CARD */
.route-card{position:fixed;right:14px;bottom:18px;z-index:10;width:340px;background:var(--panel-strong);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border:1px solid var(--stroke);border-radius:24px;padding:22px 24px;box-shadow:0 12px 40px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.05);display:none;}
.route-card.show{display:block;animation:slideIn .4s cubic-bezier(.2,.8,.2,1);}
@keyframes slideIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
.route-dest{font:600 14px/1.3 'Manrope';color:var(--text-2);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.route-eta{font:300 44px/1 'Manrope';letter-spacing:-0.03em;color:var(--cyan);font-variant-numeric:tabular-nums;text-shadow:0 0 24px rgba(0,210,223,0.4);}
.route-eta small{font-size:20px;color:var(--text-2);margin-left:6px;letter-spacing:0;}
.route-meta{display:flex;gap:20px;margin-top:10px;font:500 14px/1 'Manrope';color:var(--text-2);}
.route-meta span{display:flex;align-items:center;gap:6px;}
.route-meta b{color:var(--white);font-weight:600;font-variant-numeric:tabular-nums;}
.route-actions{display:flex;gap:10px;margin-top:16px;}
.route-btn{flex:1;height:48px;border:none;border-radius:14px;background:var(--cyan);color:#001218;font:700 14px/1 'Manrope';letter-spacing:0.04em;text-transform:uppercase;cursor:pointer;transition:transform .15s ease, box-shadow .2s ease;box-shadow:0 4px 16px rgba(0,210,223,0.3);}
.route-btn:active{transform:scale(0.96);}
.route-btn.secondary{background:rgba(255,255,255,0.06);color:var(--white);box-shadow:none;border:1px solid var(--stroke);}
.route-btn.icon-only{flex:0 0 48px;padding:0;display:grid;place-items:center;}
.route-btn.icon-only svg{width:20px;height:20px;}

/* MANEUVER */
.maneuver{position:fixed;top:90px;left:50%;transform:translateX(-50%);z-index:10;background:var(--panel-strong);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);border:1px solid var(--stroke-strong);border-radius:20px;padding:18px 26px;display:none;align-items:center;gap:20px;box-shadow:0 12px 40px rgba(0,0,0,0.55), 0 0 0 3px rgba(0,210,223,0.08);min-width:320px;max-width:80vw;}
.maneuver.show{display:flex;animation:slideIn .4s cubic-bezier(.2,.8,.2,1);}
.maneuver-icon{width:54px;height:54px;border-radius:14px;background:var(--cyan-soft);color:var(--cyan);display:grid;place-items:center;filter:drop-shadow(0 0 12px rgba(0,210,223,0.5));flex-shrink:0;}
.maneuver-icon svg{width:32px;height:32px;}
.maneuver-text{display:flex;flex-direction:column;min-width:0;}
.maneuver-dist{font:600 26px/1 'Manrope';letter-spacing:-0.02em;font-variant-numeric:tabular-nums;}
.maneuver-street{font:500 13px/1.2 'Manrope';color:var(--text-2);margin-top:5px;text-transform:uppercase;letter-spacing:0.06em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:280px;}

/* TURN ANGLE WARNINGS */
.maneuver.warning{
  border-color:#FFB300;
  box-shadow:0 12px 40px rgba(0,0,0,0.55), 0 0 0 3px rgba(255,179,0,0.18);
}
.maneuver.warning .maneuver-icon{background:rgba(255,179,0,0.18);color:#FFB300;filter:drop-shadow(0 0 14px rgba(255,179,0,0.6));}
.maneuver.danger{
  border-color:#FF3B30;
  box-shadow:0 12px 40px rgba(0,0,0,0.55), 0 0 0 4px rgba(255,59,48,0.25);
  animation:dangerPulse 1.2s ease-in-out infinite alternate;
}
.maneuver.danger .maneuver-icon{background:rgba(255,59,48,0.20);color:#FF6F66;filter:drop-shadow(0 0 16px rgba(255,59,48,0.7));}
@keyframes dangerPulse{
  from{box-shadow:0 12px 40px rgba(0,0,0,0.55), 0 0 0 3px rgba(255,59,48,0.20);}
  to{box-shadow:0 12px 40px rgba(0,0,0,0.55), 0 0 0 6px rgba(255,59,48,0.45);}
}

/* LANE GUIDANCE */
.lanes{position:fixed;top:148px;left:50%;transform:translateX(-50%);z-index:10;display:none;gap:6px;background:var(--panel-strong);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);border:1px solid var(--stroke);border-radius:14px;padding:8px 10px;box-shadow:0 8px 24px rgba(0,0,0,0.5);}
.lanes.show{display:flex;animation:slideIn .3s ease;}
.lane{width:32px;height:36px;border-radius:8px;background:rgba(255,255,255,0.04);border:1px solid var(--stroke);display:grid;place-items:center;color:var(--text-3);}
.lane.valid{color:var(--cyan);background:var(--cyan-soft);border-color:var(--stroke-strong);filter:drop-shadow(0 0 6px rgba(0,210,223,0.4));}
.lane svg{width:18px;height:18px;}

/* RESULTS */
.results{position:fixed;top:80px;left:14px;right:14px;z-index:11;background:var(--panel-strong);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border:1px solid var(--stroke);border-radius:18px;max-height:60vh;overflow-y:auto;display:none;box-shadow:0 16px 48px rgba(0,0,0,0.6);}
.results.show{display:block;animation:slideIn .25s ease;}
.result-item{padding:14px 18px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--stroke);cursor:pointer;transition:background .15s ease;}
.result-item:last-child{border-bottom:none;}
.result-item:hover{background:rgba(255,255,255,0.03);}
.result-item:active{background:rgba(0,210,223,0.08);}
.result-pin{width:36px;height:36px;border-radius:10px;background:var(--cyan-soft);color:var(--cyan);display:grid;place-items:center;flex-shrink:0;}
.result-pin svg{width:18px;height:18px;}
.result-pin.home{background:rgba(255,179,0,0.15);color:var(--amber);}
.result-pin.work{background:rgba(91,230,238,0.15);color:var(--cyan-2);}
.result-pin.fav{background:rgba(255,59,48,0.15);color:#ff6b6b;}
.result-pin.recent{background:rgba(255,255,255,0.06);color:var(--text-2);}
.result-text{flex:1;min-width:0;}
.result-name{font:600 15px/1.2 'Manrope';color:var(--white);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.result-addr{font:400 12px/1.3 'Manrope';color:var(--text-2);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.result-actions{display:flex;gap:4px;flex-shrink:0;}
.result-act{width:36px;height:36px;border-radius:10px;border:none;background:transparent;color:var(--text-2);cursor:pointer;display:grid;place-items:center;transition:background .15s;}
.result-act:hover{background:rgba(255,255,255,0.05);color:var(--white);}
.result-act svg{width:16px;height:16px;}
.results-section{padding:10px 18px 6px;font:600 11px/1 'Manrope';color:var(--text-3);text-transform:uppercase;letter-spacing:0.12em;background:rgba(0,0,0,0.2);}

/* RECENTER */
.recenter{position:fixed;right:14px;top:50%;transform:translateY(-50%);z-index:10;width:60px;height:60px;border-radius:20px;background:var(--panel);color:var(--cyan);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);border:1px solid var(--stroke);display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 32px rgba(0,0,0,0.45);transition:transform .15s ease;}
.recenter:active{transform:translateY(-50%) scale(0.94);}
.recenter svg{width:26px;height:26px;}

/* COMPASS - shows North; rotates with map bearing */
.compass{
  position:fixed;right:14px;top:96px;z-index:10;
  width:56px;height:56px;border-radius:50%;
  background:var(--panel);
  backdrop-filter:blur(20px) saturate(150%);
  -webkit-backdrop-filter:blur(20px) saturate(150%);
  border:1px solid var(--stroke);
  display:grid;place-items:center;
  box-shadow:0 8px 32px rgba(0,0,0,0.45);
  cursor:pointer;
  transition:opacity .25s ease;
  opacity:0;pointer-events:none;
}
.compass.show{opacity:1;pointer-events:auto;}
.compass-inner{
  width:48px;height:48px;border-radius:50%;
  display:grid;place-items:center;
  position:relative;
  transition:transform .3s ease-out;
}
.compass-needle{
  width:6px;height:30px;
  position:relative;
  transform-origin:center;
}
.compass-needle::before, .compass-needle::after{
  content:"";position:absolute;left:0;width:0;height:0;
  border-left:3px solid transparent;border-right:3px solid transparent;
}
.compass-needle::before{
  top:0;border-bottom:15px solid #ff3b30;
}
.compass-needle::after{
  bottom:0;border-top:15px solid #c0cce0;
}
.compass-label{
  position:absolute;top:4px;left:50%;transform:translateX(-50%);
  font:700 9px/1 'Manrope';color:#ff3b30;letter-spacing:0.1em;
}

/* SAVE MODAL */
.modal-bg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,0.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;animation:fadeIn .25s ease;}
.modal-bg.show{display:flex;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.modal{width:min(92vw,420px);background:var(--bg-deep-2);border:1px solid var(--stroke);border-radius:22px;padding:24px;box-shadow:0 24px 64px rgba(0,0,0,0.7);}
.modal-title{font:600 20px/1.2 'Manrope';letter-spacing:-0.02em;margin-bottom:6px;}
.modal-sub{font:400 13px/1.4 'Manrope';color:var(--text-2);margin-bottom:18px;}
.modal-opts{display:grid;gap:8px;}
.modal-opt{display:flex;align-items:center;gap:12px;padding:14px 16px;background:rgba(255,255,255,0.03);border:1px solid var(--stroke);border-radius:14px;cursor:pointer;color:var(--white);font:600 15px/1 'Manrope';transition:background .15s, border-color .15s;}
.modal-opt:hover{background:rgba(0,210,223,0.06);border-color:var(--stroke-strong);}
.modal-opt:active{transform:scale(0.99);}
.modal-opt-icon{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;}
.modal-opt-icon svg{width:18px;height:18px;}
.modal-opt-icon.home{background:rgba(255,179,0,0.15);color:var(--amber);}
.modal-opt-icon.work{background:rgba(91,230,238,0.15);color:var(--cyan-2);}
.modal-opt-icon.fav{background:rgba(255,59,48,0.15);color:#ff6b6b;}
.modal-cancel{margin-top:12px;width:100%;padding:12px;background:transparent;border:none;color:var(--text-2);font:500 14px/1 'Manrope';cursor:pointer;}

/* WIDE MODAL FOR SETTINGS */
.modal-wide{width:min(94vw, 520px);max-height:80vh;display:flex;flex-direction:column;}
.voice-list{
  margin-top:14px;display:flex;flex-direction:column;gap:8px;
  max-height:50vh;overflow-y:auto;padding-right:4px;
}
.voice-list::-webkit-scrollbar{width:6px;}
.voice-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:3px;}
.voice-row{
  display:flex;align-items:center;gap:14px;
  padding:14px 16px;background:rgba(255,255,255,0.03);
  border:1px solid var(--stroke);border-radius:14px;cursor:pointer;
  transition:background .15s, border-color .15s;
}
.voice-row:hover{background:rgba(0,210,223,0.06);}
.voice-row.selected{background:var(--cyan-soft);border-color:var(--stroke-strong);}
.voice-info{flex:1;min-width:0;}
.voice-name{font:600 15px/1.2 'Manrope';color:var(--white);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.voice-lang{font:400 12px/1.3 'Manrope';color:var(--text-2);margin-top:3px;text-transform:uppercase;letter-spacing:0.08em;}
.voice-test{
  width:38px;height:38px;border-radius:10px;border:none;
  background:rgba(0,210,223,0.12);color:var(--cyan);
  display:grid;place-items:center;cursor:pointer;
  transition:background .15s;
}
.voice-test:hover{background:rgba(0,210,223,0.22);}
.voice-test:active{transform:scale(0.92);}
.voice-test svg{width:18px;height:18px;}
.voice-section{
  font:600 11px/1 'Manrope';color:var(--text-3);
  text-transform:uppercase;letter-spacing:0.12em;
  padding:10px 4px 4px;
}

/* SPLASH */
.splash{position:fixed;inset:0;z-index:100;background:radial-gradient(60% 80% at 50% 50%, var(--bg-deep-2), var(--bg-deep) 80%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;transition:opacity .6s ease;}
.splash.hide{opacity:0;pointer-events:none;}
.splash-logo{width:96px;height:96px;border-radius:50%;border:2px solid rgba(0,210,223,0.4);display:grid;place-items:center;position:relative;animation:pulse 2.4s ease-in-out infinite;}
.splash-logo::before{content:"";position:absolute;inset:-12px;border-radius:50%;border:1px solid rgba(0,210,223,0.15);}
.splash-logo svg{width:48px;height:48px;color:var(--cyan);filter:drop-shadow(0 0 12px rgba(0,210,223,0.6));}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}
.splash-title{font:200 32px/1 'Manrope';letter-spacing:0.1em;text-transform:uppercase;}
.splash-title b{font-weight:600;color:var(--cyan);}
.splash-sub{font:400 13px/1 'Manrope';color:var(--text-2);letter-spacing:0.2em;text-transform:uppercase;}

/* TOAST */

<script>

// ============================================================

        <div style="max-width:380px">

          <div style="font-size:18px;font-weight:600;margin-bottom:10px">Картата не може да се зареди</div>
          <div style="font-size:14px;color:#8B95A7;line-height:1.5">MapLibre библиотеката не успя да се зареди. Това обикновено става когато файлът се отваря в preview / in-app browser. Отвори го в истински <b style="color:#00D2DF">Safari</b> или <b style="color:#00D2DF">Chrome</b>, или го качи на хостинг (напр. netlify.com/drop) и отвори линка.</div>
        </div>
      </div>`);
  }
}, 8000);

// Global error catcher so script errors are visible
window.addEventListener('error', (e)=>{
  const t = document.getElementById('toast');
  if(t){ t.textContent = 'Грешка: ' + (e.message || 'Script error'); t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 5000); }

<script>
// ============================================================
// MBUX-STYLE NAVIGATION v2
// ============================================================

// --- Local storage helpers ---
const LS = {
  get(k, def=null){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch(e){return def;} },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};

// --- Clock ---
function tick(){
  const d=new Date();
  document.getElementById('time').textContent =
    String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
tick(); setInterval(tick, 10000);

// --- Toast ---
let toastTimer;
function toast(msg, ms=2400){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'), ms);
}

// ============================================================
// VOICE (Bulgarian TTS via Web Speech API)
// ============================================================
const Voice = {
  enabled: LS.get('mbux-voice-enabled', true),
  voiceURI: LS.get('mbux-voice-uri', null),
  bgVoice: null,
  allVoices: [],
  initialized: false,
  init(){
    if(!('speechSynthesis' in window)) return;
    const findBG = () => {
      const voices = speechSynthesis.getVoices();
      this.allVoices = voices;
      // Use user's saved selection if it still exists
      let chosen = null;
      if(this.voiceURI){
        chosen = voices.find(v => v.voiceURI === this.voiceURI);
      }
      // Fallback hierarchy: Bulgarian -> Slavic relatives -> default
      this.bgVoice = chosen
                  || voices.find(v => /^bg/i.test(v.lang))
                  || voices.find(v => /^(ru|uk|sr|mk)/i.test(v.lang))
                  || voices[0];
      this.initialized = true;
    };
    findBG();
    if(!this.bgVoice && speechSynthesis.onvoiceschanged !== undefined){
      speechSynthesis.onvoiceschanged = findBG;
    }
    // Safari sometimes loads voices asynchronously even when getVoices initially returns some
    if(speechSynthesis.onvoiceschanged !== undefined){
      const orig = speechSynthesis.onvoiceschanged;
      speechSynthesis.onvoiceschanged = ()=>{ findBG(); if(orig) orig(); };
    }
    this.updateUI();
  },
  speak(text){
    if(!this.enabled || !('speechSynthesis' in window)) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = (this.bgVoice && this.bgVoice.lang) || 'bg-BG';
      if(this.bgVoice) u.voice = this.bgVoice;
      u.rate = 1.0; u.pitch = 1.0; u.volume = 1.0;
      speechSynthesis.speak(u);
    } catch(e){}
  },
  setVoice(uri){
    this.voiceURI = uri;
    LS.set('mbux-voice-uri', uri);
    const v = this.allVoices.find(x => x.voiceURI === uri);
    if(v) this.bgVoice = v;
  },
  toggle(){
    this.enabled = !this.enabled;
    LS.set('mbux-voice-enabled', this.enabled);
    this.updateUI();
    toast(this.enabled ? 'Глас включен' : 'Глас изключен');
    if(this.enabled) this.speak('Гласът е включен');
    else if('speechSynthesis' in window) speechSynthesis.cancel();
  },
  updateUI(){
    const btn = document.getElementById('voiceBtn');
    btn.classList.toggle('on', this.enabled);
    document.getElementById('voiceIcon').innerHTML = this.enabled
      ? '<path d="M11 5 L6 9 L2 9 L2 15 L6 15 L11 19 Z"/><path d="M15.5 8.5 a5 5 0 0 1 0 7"/><path d="M19 5 a10 10 0 0 1 0 14"/>'
      : '<path d="M11 5 L6 9 L2 9 L2 15 L6 15 L11 19 Z"/><path d="M22 9 L16 15"/><path d="M16 9 L22 15"/>';
  }
};
Voice.init();
document.getElementById('voiceBtn').addEventListener('click', ()=> Voice.toggle());

// ============================================================
// SETTINGS MODAL — voice picker
// ============================================================
function openSettings(){
  renderVoiceList();
  document.getElementById('settingsModal').classList.add('show');
}
function closeSettings(){
  document.getElementById('settingsModal').classList.remove('show');
}
function renderVoiceList(){
  const list = document.getElementById('voiceList');
  const voices = Voice.allVoices || (('speechSynthesis' in window) ? speechSynthesis.getVoices() : []);
  if(!voices.length){
    list.innerHTML = `<div class="voice-row"><div class="voice-info"><div class="voice-name">Няма налични гласове</div><div class="voice-lang">Системата няма инсталирани TTS гласове</div></div></div>`;
    return;
  }
  // Group: BG -> Slavic -> Others
  const bg = voices.filter(v => /^bg/i.test(v.lang));
  const slavic = voices.filter(v => /^(ru|uk|sr|mk|pl|cs|sk|hr|sl)/i.test(v.lang));
  const others = voices.filter(v => !/^(bg|ru|uk|sr|mk|pl|cs|sk|hr|sl)/i.test(v.lang));

  const renderRow = (v) => {
    const selected = (Voice.bgVoice && Voice.bgVoice.voiceURI === v.voiceURI) ? 'selected' : '';
    return `
      <div class="voice-row ${selected}" data-uri="${escapeHTML(v.voiceURI)}">
        <div class="voice-info">
          <div class="voice-name">${escapeHTML(v.name||v.voiceURI)}</div>
          <div class="voice-lang">${escapeHTML(v.lang||'')}${v.default ? ' · по подразбиране' : ''}</div>
        </div>
        <button class="voice-test" data-test-uri="${escapeHTML(v.voiceURI)}" title="Тест">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        </button>
      </div>`;
  };

  let html = '';
  if(bg.length){ html += `<div class="voice-section">Български</div>` + bg.map(renderRow).join(''); }
  if(slavic.length){ html += `<div class="voice-section">Славянски (за резерв)</div>` + slavic.map(renderRow).join(''); }
  if(others.length){ html += `<div class="voice-section">Други</div>` + others.map(renderRow).join(''); }
  list.innerHTML = html;

  list.querySelectorAll('.voice-row').forEach(row=>{
    row.addEventListener('click', (e)=>{
      if(e.target.closest('.voice-test')) return;
      const uri = row.dataset.uri;
      Voice.setVoice(uri);
      // re-render to update selected state
      list.querySelectorAll('.voice-row').forEach(r => r.classList.remove('selected'));
      row.classList.add('selected');
      toast('Гласът е сменен');
    });
  });
  list.querySelectorAll('[data-test-uri]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const uri = btn.dataset.testUri;
      const v = voices.find(x => x.voiceURI === uri);
      if(!v) return;
      try {
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance('Завийте надясно по улица Витоша');
        u.voice = v; u.lang = v.lang || 'bg-BG';
        speechSynthesis.speak(u);
      } catch(e){}
    });
  });
}

document.getElementById('settingsBtn').addEventListener('click', openSettings);
document.getElementById('settingsCancel').addEventListener('click', closeSettings);
document.getElementById('settingsModal').addEventListener('click', (e)=>{
  if(e.target.id === 'settingsModal') closeSettings();
});

// ============================================================
// MAP
// ============================================================
const FALLBACK_STYLE = {
  version: 8,
  sources: { 'osm': { type:'raster', tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'], tileSize:256 } },
  layers: [
    { id:'bg', type:'background', paint:{'background-color':'#0a1428'} },
    { id:'osm', type:'raster', source:'osm', paint:{ 'raster-brightness-min':0.10, 'raster-brightness-max':0.55, 'raster-saturation':-0.4, 'raster-contrast':0.25, 'raster-hue-rotate':200 } }
  ]
};

if(typeof maplibregl === 'undefined'){
  // Library failed to load — safety timer will show the error UI
  throw new Error('MapLibre GL did not load (CDN blocked?)');
}

const map = new maplibregl.Map({
  container: 'map',

// ============================================================
// 3D SCENE — buildings, sky, light
// ============================================================
function add3DScene(){
  try {
    const style = map.getStyle();
    if(!style || !style.sources) return;

    // Find a vector source containing buildings (OpenMapTiles schema)
    let vectorSourceName = null;
    for(const [name, src] of Object.entries(style.sources)){
      if(src.type === 'vector'){ vectorSourceName = name; break; }
    }

    // SKY — premium multi-stop horizon gradient
    try {
      if(!map.getLayer('mbux-sky')){
        map.addLayer({
          id:'mbux-sky', type:'sky',
          paint:{
            'sky-type':'gradient',
            'sky-gradient':[
              'interpolate', ['linear'], ['sky-radial-progress'],
              0.0,  'rgba(10, 20, 40, 0)',
              0.3,  'rgba(14, 26, 56, 0.5)',
              0.55, 'rgba(20, 38, 84, 0.8)',
              0.78, 'rgba(34, 56, 124, 0.95)',
              1.0,  'rgba(48, 72, 156, 1.0)'
            ],
            'sky-gradient-center':[0, 0],
            'sky-gradient-radius': 90,
            'sky-opacity':['interpolate',['linear'],['zoom'], 0, 0, 8, 0.5, 14, 1]
          }
        });
      }
    } catch(e){ console.warn('sky add failed', e); }

    // LIGHT — gives buildings a soft cyan-tinted shading
    try {
      map.setLight({
        anchor:'viewport',
        color:'#a8e8ee',
        intensity:0.45,
        position:[1.3, 200, 35]
      });
    } catch(e){}

    if(!vectorSourceName) return;

    // 3D BUILDINGS (extrusion)
    const heightExpr = ['coalesce',
      ['get','render_height'],
      ['get','height'],
      ['*',['coalesce',['get','levels'],['get','building:levels'],2], 3]
    ];
    const baseExpr = ['coalesce',
      ['get','render_min_height'],
      ['get','min_height'],
      0
    ];

    if(!map.getLayer('mbux-buildings-3d')){
      try {
        map.addLayer({
          id:'mbux-buildings-3d',
          type:'fill-extrusion',
          source: vectorSourceName,
          'source-layer':'building',
          minzoom:14,
          paint:{
            'fill-extrusion-color':[
              'interpolate', ['linear'],
              // base color from height, plus subtle variation per building (mod of osm id)
              ['+', heightExpr,
                ['case',
                  ['has', 'osm_id'],
                  ['*', ['%', ['to-number', ['get','osm_id']], 11], 1.2],
                  0
                ]
              ],
              0,   '#1a2850',
              15,  '#243668',
              40,  '#324a86',
              90,  '#4060ae',
              200, '#5478d0'
            ],
            'fill-extrusion-height':[
              'interpolate',['linear'],['zoom'],
              14, 0,
              14.6, heightExpr
            ],
            'fill-extrusion-base': baseExpr,
            'fill-extrusion-opacity': 0.94,
            'fill-extrusion-vertical-gradient': true,
            'fill-extrusion-ambient-occlusion-intensity': 0.35,
            'fill-extrusion-ambient-occlusion-radius': 3
          }
        });
      } catch(e){
        // Maybe source-layer name differs — try a few common ones
        const candidates = ['building','buildings','osm:building'];
        for(const sl of candidates){
          try {
            map.addLayer({
              id:'mbux-buildings-3d',
              type:'fill-extrusion',
              source: vectorSourceName,
              'source-layer': sl,
              minzoom:14,
              paint:{
                'fill-extrusion-color':'#1a2548',
                'fill-extrusion-height': heightExpr,
                'fill-extrusion-base': baseExpr,
                'fill-extrusion-opacity': 0.9,
                'fill-extrusion-vertical-gradient': true
              }
            });
            break;
          } catch(_){}
        }
      }
    }

    // ROOF GLOW — thin layer just above building tops for cyan edge accent
    try {
      if(!map.getLayer('mbux-buildings-glow')){
        map.addLayer({
          id:'mbux-buildings-glow',
          type:'fill-extrusion',
          source: vectorSourceName,
          'source-layer':'building',
          minzoom:15,
          filter: ['>', heightExpr, 12], // only tall-ish buildings glow
          paint:{
            'fill-extrusion-color':'#5BE6EE',
            'fill-extrusion-height':['+', heightExpr, 0.6],
            'fill-extrusion-base': heightExpr,
            'fill-extrusion-opacity': 0.35
          }
        });
      }
    } catch(e){}

  } catch(e){ console.warn('3D scene init failed:', e); }
}

// ============================================================
// GEOLOCATION
// ============================================================
let userLngLat = null;
let userHeading = 0;
let followUser = true;
let lastSpeed = 0;
let smoothCamSpeed = 0;
let demoMode = false;

function startGeolocation(){
  if(!('geolocation' in navigator)){
    toast('GPS не е наличен'); startDemo(); return;
  }
  try {
    navigator.geolocation.watchPosition(
      (pos)=>{
        try {
          const { latitude, longitude, speed, heading } = pos.coords;
          userLngLat = [longitude, latitude];
          if(gpsMarker) gpsMarker.setLngLat(userLngLat);
          const kmh = (speed && speed>0) ? Math.round(speed * 3.6) : 0;
          setSpeed(kmh);
          if(typeof heading === 'number' && !isNaN(heading)) userHeading = heading;
          // Rotate car to point in direction of travel
          if(gpsMarker && typeof userHeading === 'number') gpsMarker.setRotation(userHeading);
          if(followUser){
            const cam = getCameraForSpeed(navActive);
            map.easeTo({
              center: userLngLat,
              zoom: cam.zoom,
              bearing: navActive ? userHeading : 0,
              pitch: cam.pitch,
              padding: { top:0, bottom:cam.padBottom, left:0, right:0 },
              duration: 900
            });
          }
          if(navActive && routeCoords) updateRemaining();
          maybeWarnSpeed();
        } catch(inner){ console.warn('GPS handler error:', inner); }
      },
      (err)=>{
        console.warn('Geolocation error:', err);
        toast('GPS отказан — Demo');
        startDemo();
      },
      { enableHighAccuracy:true, maximumAge:1000, timeout:20000 }
    );
  } catch(e){
    console.warn('watchPosition threw:', e);
    startDemo();
  }
}

function setSpeed(kmh){
  lastSpeed = kmh;
  // Smooth speed for camera (less jitter than raw GPS)
  smoothCamSpeed = smoothCamSpeed * 0.65 + (kmh||0) * 0.35;
  document.getElementById('speedVal').textContent = kmh;
  const max = 180, pct = Math.min(kmh/max, 1);
  const C = 2*Math.PI*54;
  document.getElementById('speedArc').style.strokeDasharray = C;
  document.getElementById('speedArc').style.strokeDashoffset = C * (1 - pct);
}

// ============================================================
// SPEED-ADAPTIVE CAMERA
// City/slow -> close-up immersive view (you see buildings around you)
// Highway/fast -> slightly wider with more look-ahead (you see road further out)
// ============================================================
function getCameraForSpeed(isNav){
  const s = Math.max(0, Math.min(smoothCamSpeed, 130));
  // Saturate around 90 km/h
  const t = Math.min(s / 90, 1);
  const e = t * t * (3 - 2 * t); // smoothstep

  // INVERTED: high zoom at slow speed (close, city view), lower at fast (look ahead)
  const baseZoom  = isNav ? 17.6 : 16.4;
  const peakZoom  = isNav ? 17.0 : 15.8;
  const baseTilt  = isNav ? 50   : 45;
  const peakTilt  = isNav ? 64   : 60;

  // Look-ahead padding
  const maxPad = Math.min((window.innerHeight||500) * 0.20, 120);

  return {
    zoom: baseZoom + (peakZoom - baseZoom) * e,
    pitch: baseTilt + (peakTilt - baseTilt) * e,
    padBottom: e * maxPad
  };
}

function maybeWarnSpeed(){
  const limit = parseInt(document.getElementById('speedLimit').textContent, 10) || 0;
  const el = document.getElementById('speedLimit');
  if(limit > 0 && lastSpeed > limit + 10){
    el.classList.add('warning');
  } else {
    el.classList.remove('warning');
  }
}

function startDemo(){
  demoMode = true;
  let t = 0;
  const center = [27.9147, 43.2141];
  setInterval(()=>{
    t += 0.0004;
    const prev = userLngLat;
    userLngLat = [center[0]+t, center[1]+t*0.4];
    if(gpsMarker) gpsMarker.setLngLat(userLngLat);
    // Compute heading from movement direction
    if(prev){
      const dx = userLngLat[0]-prev[0], dy = userLngLat[1]-prev[1];
      // bearing in degrees from North, clockwise
      const bearing = (Math.atan2(dx, dy) * 180/Math.PI + 360) % 360;
      userHeading = bearing;
      if(gpsMarker) gpsMarker.setRotation(bearing);
    }
    // Simulate a speed that cycles between ~15 and ~125 km/h so the camera reacts visibly
    const kmh = Math.max(0, Math.round(70 + Math.sin(t*40) * 55));
    setSpeed(kmh);
    if(followUser){
      const cam = getCameraForSpeed(navActive);
      map.easeTo({
        center: userLngLat,
        zoom: cam.zoom,
        pitch: cam.pitch,
        padding: { top:0, bottom:cam.padBottom, left:0, right:0 },
        duration: 900
      });
    }
  }, 1000);
}

// ============================================================
// PLACE DETECTION — welcome announcements when entering town/village
// ============================================================
let lastKnownPlace = null;
let lastPlaceCheckPos = null;
let placeCheckInFlight = false;

async function checkCurrentPlace(){
  if(!userLngLat || placeCheckInFlight) return;
  // Only query if we've moved >400m since last successful check
  if(lastPlaceCheckPos){
    const moved = haversine(userLngLat, lastPlaceCheckPos);
    if(moved < 400) return;
  }
  placeCheckInFlight = true;

  try {
    const url = `https://nominatim.openstreetmap.org/reverse?lat=${userLngLat[1]}&lon=${userLngLat[0]}&zoom=14&format=json&accept-language=bg`;
    const r = await fetch(url, { headers:{ 'Accept':'application/json' } });
    if(!r.ok){ placeCheckInFlight = false; return; }
    const data = await r.json();
    lastPlaceCheckPos = [userLngLat[0], userLngLat[1]];
    if(!data || !data.address){ placeCheckInFlight = false; return; }

    const a = data.address;
    // Pick the most local populated place
    const place = a.village || a.town || a.city || a.municipality || null;

    if(!place){
      // Outside populated area — clear current known so we re-announce when entering next one
      if(lastKnownPlace !== null) lastKnownPlace = null;
    } else if(lastKnownPlace === null){
      // First valid place — initialize without announcing
      lastKnownPlace = place;
    } else if(place !== lastKnownPlace){
      lastKnownPlace = place;
      const msg = `Добре дошли в ${place}`;
      Voice.speak(msg);
      toast(msg, 4500);
    }
  } catch(e){
    console.warn('Place check failed:', e);
  }
  placeCheckInFlight = false;
}

// Initial check shortly after first GPS fix, then periodically
setTimeout(checkCurrentPlace, 5000);
setInterval(checkCurrentPlace, 30000);

// ============================================================
// AUTO-FOLLOW
// User pans/zooms manually -> stop following. After idle, re-engage.
// ============================================================
let autoFollowTimer = null;
const AUTO_FOLLOW_MS = 6000;

function autoRecenter(){
  if(!userLngLat || followUser) return;
  followUser = true;
  const cam = getCameraForSpeed(navActive);
  map.easeTo({
    center: userLngLat,
    zoom: cam.zoom,
    pitch: cam.pitch,
    bearing: navActive ? userHeading : 0,
    padding: { top:0, bottom:cam.padBottom, left:0, right:0 },
    duration: 1400
  });
  toast('Авто-следване');
}

function flagUserInteract(){
  followUser = false;
  clearTimeout(autoFollowTimer);
}
function scheduleAutoFollow(){
  clearTimeout(autoFollowTimer);
  autoFollowTimer = setTimeout(autoRecenter, AUTO_FOLLOW_MS);
}

map.on('dragstart', flagUserInteract);
map.on('dragend', scheduleAutoFollow);
map.on('zoomstart', (e)=>{ if(e.originalEvent) flagUserInteract(); });
map.on('zoomend',   (e)=>{ if(e.originalEvent) scheduleAutoFollow(); });
map.on('rotatestart',(e)=>{ if(e.originalEvent) flagUserInteract(); });
map.on('rotateend', (e)=>{ if(e.originalEvent) scheduleAutoFollow(); });
map.on('pitchstart',(e)=>{ if(e.originalEvent) flagUserInteract(); });
map.on('pitchend',  (e)=>{ if(e.originalEvent) scheduleAutoFollow(); });

// COMPASS — show when bearing != 0, rotate to match map
map.on('rotate', updateCompass);
map.on('load', updateCompass);
function updateCompass(){
  const bearing = map.getBearing();
  const inner = document.getElementById('compassInner');
  const compass = document.getElementById('compass');
  if(!inner || !compass) return;
  inner.style.transform = `rotate(${-bearing}deg)`;
  compass.classList.toggle('show', Math.abs(bearing) > 1.5);
}
document.getElementById('compass').addEventListener('click', ()=>{
  // Reset to North up
  map.easeTo({ bearing: 0, duration: 600 });
});

// SEARCH (Nominatim)
// ============================================================
const searchInput = document.getElementById('searchInput');
const resultsEl = document.getElementById('results');
let searchTimer = null;
let activeMode = 'search'; // 'search' | 'recent' | 'favs'

searchInput.addEventListener('input', (e)=>{
  const q = e.target.value.trim();
  clearTimeout(searchTimer);
  if(q.length < 2){ resultsEl.classList.remove('show'); return; }
  activeMode = 'search';
  searchTimer = setTimeout(()=> doSearch(q), 350);
});

searchInput.addEventListener('focus', ()=>{
  if(searchInput.value.trim().length >= 2){
    activeMode='search';
    resultsEl.classList.add('show');
  } else {
    showQuickPlaces();
  }
});

document.addEventListener('click', (e)=>{
  if(!resultsEl.contains(e.target) && e.target !== searchInput && !e.target.closest('.left-rail')) {
    resultsEl.classList.remove('show');
  }
});

async function doSearch(q){
  try {
    const url = new URL('https://nominatim.openstreetmap.org/search');
    url.searchParams.set('q', q);
    url.searchParams.set('format', 'json');
    url.searchParams.set('limit', '6');
    url.searchParams.set('accept-language', 'bg');
    if(userLngLat){
      const [lng, lat] = userLngLat; const d = 1.5;
      url.searchParams.set('viewbox', `${lng-d},${lat+d},${lng+d},${lat-d}`);
      url.searchParams.set('bounded', '0');
    }
    const r = await fetch(url, { headers:{'Accept':'application/json'} });
    const data = await r.json();
    renderSearchResults(data);
  } catch(err){
    console.error(err); toast('Грешка при търсене');
  }
}

function escapeHTML(s){return (s||'').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}

function renderSearchResults(items){
  if(!items || !items.length){
    resultsEl.innerHTML = `<div class="result-item"><div class="result-text"><div class="result-name">Няма резултати</div></div></div>`;
    resultsEl.classList.add('show'); return;
  }
  resultsEl.innerHTML = items.map(it=>{
    const parts = (it.display_name||'').split(',').map(s=>s.trim());
    const name = parts.slice(0,1).join(', ');
    const addr = parts.slice(1, 4).join(', ');
    return `

// ============================================================
// ROUTING (OSRM)
// ============================================================
let destination = null;
let destinationName = '';
let routeCoords = null;
let routeDistance = 0;
let routeDuration = 0;
let routeSteps = [];
let navActive = false;
let destMarker = null;
let currentStepIdx = 0;
let lastSpokenStepIdx = -1;
let lastSpokenThreshold = null;

async function pickDestination(lngLat, name){
  destination = lngLat; destinationName = name || '';
  searchInput.value = name || '';
  resultsEl.classList.remove('show');

  if(destMarker) destMarker.remove();
  const el = document.createElement('div');
  el.style.cssText = 'width:30px;height:30px;display:grid;place-items:center;';
  el.innerHTML = `<svg viewBox="0 0 24 24" width="30" height="30" fill="#00D2DF" stroke="#001218" stroke-width="1.2" style="filter:drop-shadow(0 4px 12px rgba(0,210,223,0.6))"><path d="M12 22s-8-7.58-8-13a8 8 0 0 1 16 0c0 5.42-8 13-8 13z"/><circle cx="12" cy="9" r="2.5" fill="#001218"/></svg>`;
  destMarker = new maplibregl.Marker({ element: el, anchor:'bottom' }).setLngLat(lngLat).addTo(map);

  pushRecent({ lng:lngLat[0], lat:lngLat[1], name, addr:'' });

  if(!userLngLat){ toast('Изчакване на GPS...'); return; }
  await fetchRoute(userLngLat, lngLat);
}

async function fetchRoute(from, to){
  try {
    const url = `https://router.project-osrm.org/route/v1/driving/${from[0]},${from[1]};${to[0]},${to[1]}?overview=full&geometries=geojson&steps=true&annotations=false`;
    const r = await fetch(url);
    const data = await r.json();
    if(!data.routes || !data.routes.length){ toast('Няма маршрут'); return; }
    const route = data.routes[0];
    routeCoords = route.geometry.coordinates;
    routeDistance = route.distance;
    routeDuration = route.duration;
    routeSteps = (route.legs && route.legs[0] && route.legs[0].steps) || [];
    currentStepIdx = 0; lastSpokenStepIdx = -1; lastSpokenThreshold = null;
    spokenAnnouncements = new Set();

    drawRoute(routeCoords);
    showRouteCard();
    fitRoute(routeCoords);
    fetchTrafficSignals(routeCoords);
  } catch(err){
    console.error(err); toast('Грешка при маршрута');
  }
}

function drawRoute(coords){
  const data = { type:'Feature', geometry:{ type:'LineString', coordinates: coords } };
  if(map.getSource('route')){
    map.getSource('route').setData(data);
    // Ensure chevron arrows are added even if route already exists
    ensureChevronImage();
    return;
  }
  map.addSource('route', { type:'geojson', data });
  // Outer glow underlay
  map.addLayer({
    id:'route-glow', type:'line', source:'route',
    layout:{ 'line-cap':'round', 'line-join':'round' },
    paint:{
      'line-color':'#00D2DF',
      'line-width': ['interpolate',['linear'],['zoom'], 12, 8, 16, 22, 20, 36],
      'line-opacity':0.22,
      'line-blur':8
    }
  });
  // Main line
  map.addLayer({
    id:'route-line', type:'line', source:'route',
    layout:{ 'line-cap':'round', 'line-join':'round' },
    paint:{
      'line-color':'#00D2DF',
      'line-width': ['interpolate',['linear'],['zoom'], 12, 4, 16, 9, 20, 16],
      'line-opacity':0.95
    }
  });
  // Inner white core
  map.addLayer({
    id:'route-core', type:'line', source:'route',
    layout:{ 'line-cap':'round', 'line-join':'round' },
    paint:{
      'line-color':'#ffffff',
      'line-width': ['interpolate',['linear'],['zoom'], 12, 1, 16, 2.5, 20, 4],
      'line-opacity':0.5
    }
  });
  ensureChevronImage();
}

// Create a chevron icon and add a symbol layer that places it along the route
let chevronImageReady = false;
function ensureChevronImage(){
  if(chevronImageReady && map.getLayer('route-arrows')) return;
  if(!chevronImageReady){
    try {
      const size = 64;
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      // White chevron pointing right (will be rotated by maplibre along the line)
      ctx.lineWidth = 9;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = 'rgba(255,255,255,0.95)';
      ctx.shadowColor = 'rgba(0, 210, 223, 0.6)';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.moveTo(20, 14);
      ctx.lineTo(44, 32);
      ctx.lineTo(20, 50);
      ctx.stroke();
      const imgData = ctx.getImageData(0, 0, size, size);
      if(!map.hasImage('mbux-chevron')) map.addImage('mbux-chevron', imgData, { pixelRatio: 2 });
      chevronImageReady = true;
    } catch(e){ console.warn('chevron image failed', e); }
  }
  if(!map.getLayer('route-arrows') && map.getSource('route')){
    try {
      map.addLayer({
        id:'route-arrows', type:'symbol', source:'route',
        layout:{
          'symbol-placement':'line',
          'symbol-spacing': ['interpolate',['linear'],['zoom'], 12, 60, 16, 90, 20, 140],
          'icon-image':'mbux-chevron',
          'icon-size': ['interpolate',['linear'],['zoom'], 12, 0.4, 16, 0.6, 20, 0.85],
          'icon-rotation-alignment':'map',
          'icon-pitch-alignment':'map',
          'icon-allow-overlap':true,
          'icon-ignore-placement':true
        }
      });
    } catch(e){ console.warn('arrows layer failed', e); }
  }
}

function clearRoute(){
  ['route-arrows','route-core','route-line','route-glow'].forEach(id=>{ if(map.getLayer(id)) map.removeLayer(id); });
  if(map.getSource('route')) map.removeSource('route');
  // Clear signals
  if(map.getLayer('signals')) map.removeLayer('signals');
  if(map.getSource('signals')) map.removeSource('signals');
  routeCoords = null; routeSteps = [];
}

function fitRoute(coords){
  const bounds = coords.reduce((b,c)=> b.extend(c), new maplibregl.LngLatBounds(coords[0], coords[0]));
  map.fitBounds(bounds, { padding:{ top:160, left:120, right:340, bottom:200 }, duration:1000, pitch:55 });
  followUser = false;
}

function showRouteCard(){
  const card = document.getElementById('routeCard');
  card.classList.add('show');
  document.getElementById('routeDest').textContent = destinationName || 'Дестинация';
  const km = (routeDistance/1000);
  const min = Math.round(routeDuration/60);
  document.getElementById('etaKm').textContent = km < 10 ? km.toFixed(1) : Math.round(km);
  document.getElementById('etaMin').textContent = min;
  const arrival = new Date(Date.now() + routeDuration*1000);
  document.getElementById('etaTime').textContent =
    String(arrival.getHours()).padStart(2,'0')+':'+String(arrival.getMinutes()).padStart(2,'0');
}

function updateRemaining(){
  if(!routeCoords || !userLngLat) return;

  // Find closest route point to user
  let best = { d: Infinity, idx: 0 };
  for(let i=0; i<routeCoords.length; i++){
    const d = haversine(userLngLat, routeCoords[i]);
    if(d < best.d){ best.d = d; best.idx = i; }
  }
  let remaining = 0;
  for(let i=best.idx; i<routeCoords.length-1; i++){
    remaining += haversine(routeCoords[i], routeCoords[i+1]);
  }
  const ratio = remaining / routeDistance;
  const remSec = routeDuration * ratio;
  document.getElementById('etaKm').textContent = (remaining/1000) < 10 ? (remaining/1000).toFixed(1) : Math.round(remaining/1000);
  document.getElementById('etaMin').textContent = Math.max(0, Math.round(remSec/60));
  const arrival = new Date(Date.now() + remSec*1000);
  document.getElementById('etaTime').textContent =
    String(arrival.getHours()).padStart(2,'0')+':'+String(arrival.getMinutes()).padStart(2,'0');

  // Update current step
  if(routeSteps.length){
    // pick next step (where maneuver location is still ahead)
    let nextIdx = routeSteps.length - 1;
    for(let i=currentStepIdx; i<routeSteps.length; i++){
      const s = routeSteps[i];
      if(!s.geometry || !s.geometry.coordinates || !s.geometry.coordinates.length) continue;
      const maneuverPoint = s.maneuver && s.maneuver.location ? s.maneuver.location : s.geometry.coordinates[0];
      const d = haversine(userLngLat, maneuverPoint);
      if(d > 25){ nextIdx = i; break; }
      else { currentStepIdx = i + 1; }
    }
    const step = routeSteps[nextIdx];
    if(step){
      const maneuverPoint = step.maneuver && step.maneuver.location ? step.maneuver.location : step.geometry.coordinates[0];
      const d = haversine(userLngLat, maneuverPoint);
      document.getElementById('maneuverDist').textContent = d > 1000 ? (d/1000).toFixed(1)+' км' : Math.round(d/10)*10+' м';
      document.getElementById('maneuverStreet').textContent = maneuverLabel(step);
      document.getElementById('maneuverIcon').innerHTML = maneuverIcon(step.maneuver);

      // Turn severity — visual color of the bubble
      const sev = turnSeverity(step);
      const mEl = document.getElementById('maneuver');
      mEl.classList.toggle('warning', sev === 'warning');
      mEl.classList.toggle('danger',  sev === 'danger');

      updateLaneGuidance(step);
      maybeAnnounce(step, d, nextIdx);
    }
  }

  // Arrival
  if(remaining < 40){
    if(navActive){
      navActive = false;
      Voice.speak('Пристигнахте в крайната точка');
      document.getElementById('maneuver').classList.remove('show');
      document.getElementById('lanes').classList.remove('show');
      toast('Пристигнахте');
    }
  }
}

// ============================================================
// VOICE ANNOUNCEMENTS
// ============================================================
const DIR_BG = {
  'left':'наляво', 'right':'надясно',
  'slight left':'леко наляво', 'slight right':'леко надясно',
  'sharp left':'рязко наляво', 'sharp right':'рязко надясно',
  'straight':'направо', 'uturn':'обратно'
};
const ORDINAL_BG = {1:'първия',2:'втория',3:'третия',4:'четвъртия',5:'петия',6:'шестия',7:'седмия',8:'осмия',9:'деветия'};

function speakManeuver(step){
  const m = step.maneuver || {};
  const mod = (m.modifier || 'straight').toLowerCase();
  const type = (m.type || '').toLowerCase();
  const street = step.name || '';
  const dir = DIR_BG[mod] || 'направо';

  let phrase = '';
  let addStreet = true;

  switch(type){
    case 'depart':
      phrase = 'тръгнете' + (street ? ' по ' + street : '');
      addStreet = false;
      break;
    case 'arrive':
      phrase = 'пристигнахте в крайната точка';
      addStreet = false;
      break;
    case 'turn':
      phrase = mod === 'uturn' ? 'завийте обратно' : 'завийте ' + dir;
      break;
    case 'continue':
      phrase = (mod === 'straight' || !mod) ? 'продължете направо' : 'продължете ' + dir;
      break;
    case 'merge':
      phrase = 'влейте се ' + (dir === 'наляво' ? 'отляво' : dir === 'надясно' ? 'отдясно' : 'в потока');
      break;
    case 'on ramp':
      phrase = 'вземете рампата ' + (mod && mod !== 'straight' ? dir : 'напред');
      break;
    case 'off ramp':
      phrase = 'излезте по рампата ' + (mod && mod !== 'straight' ? dir : 'напред');
      break;
    case 'fork':
      phrase = (mod === 'straight' || !mod) ? 'на разклонението продължете направо' : 'на разклонението дръжте ' + dir;
      break;
    case 'end of road':
      phrase = mod === 'uturn' ? 'в края на пътя завийте обратно' : 'в края на пътя завийте ' + dir;
      break;
    case 'roundabout':
    case 'rotary':
      if(m.exit) phrase = `на кръговото излезте на ${ORDINAL_BG[m.exit] || (m.exit+'-и')} изход`;
      else phrase = 'влезте в кръговото';
      addStreet = false;
      break;
    case 'roundabout turn':
      phrase = 'на кръговото завийте ' + dir;
      addStreet = false;
      break;
    case 'exit roundabout':
    case 'exit rotary':
      phrase = 'излезте от кръговото';
      addStreet = false;
      break;
    case 'new name':
    case 'notification':
      return ''; // skip — usually just road name change
    default:
      // Fallback: trust modifier
      if(mod === 'straight' || !mod) phrase = 'продължете направо';
      else if(mod === 'uturn') phrase = 'завийте обратно';
      else phrase = 'завийте ' + dir;
  }

  if(phrase && street && addStreet) phrase += ' по ' + street;
  return phrase;
}

// Tracks which announcement thresholds have been spoken (per step)
let spokenAnnouncements = new Set();

// ============================================================
// TURN SEVERITY — calculate sharpness from bearing change
// ============================================================
function getTurnAngle(maneuver){
  if(!maneuver) return 0;
  const a = maneuver.bearing_before, b = maneuver.bearing_after;
  if(typeof a !== 'number' || typeof b !== 'number') return 0;
  let diff = b - a;
  while(diff > 180) diff -= 360;
  while(diff < -180) diff += 360;
  return Math.abs(diff);
}
// Returns 'danger' (>=50°), 'warning' (40-50°), or '' for normal/no turn
function turnSeverity(step){
  if(!step || !step.maneuver) return '';
  const type = (step.maneuver.type || '').toLowerCase();
  // Skip start/end — they don't have meaningful "turn"
  if(type === 'depart' || type === 'arrive') return '';
  const angle = getTurnAngle(step.maneuver);
  if(angle >= 50) return 'danger';
  if(angle >= 40) return 'warning';
  return '';
}

function maybeAnnounce(step, distance, stepIdx){
  if(!Voice.enabled || !navActive) return;
  const phrase = speakManeuver(step);
  if(!phrase) return;

  // Severity prefix for sharp turns
  const sev = turnSeverity(step);
  let prefix = '';
  if(sev === 'danger') prefix = 'Опасен завой! ';
  else if(sev === 'warning') prefix = 'Внимание, ';

  // On first observation of this step, mark thresholds we're already past as "spoken"
  // so we don't announce "in 700 meters" when we're at 400 meters from it.
  const initKey = stepIdx + '@init';
  if(!spokenAnnouncements.has(initKey)){
    spokenAnnouncements.add(initKey);
    if(distance < 650) spokenAnnouncements.add(stepIdx + '@700');
    if(distance < 220) spokenAnnouncements.add(stepIdx + '@250');
  }

  const thresholds = [
    { m: 700, prefix: 'След 700 метра ' },
    { m: 250, prefix: 'След 250 метра ' },
    { m: 70,  prefix: '' }
  ];

  for(const t of thresholds){
    const key = stepIdx + '@' + t.m;
    if(distance < t.m && !spokenAnnouncements.has(key)){
      spokenAnnouncements.add(key);
      const body = t.prefix
        ? t.prefix + phrase
        : phrase.charAt(0).toUpperCase() + phrase.slice(1);
      Voice.speak(prefix + body);
      return;
    }
  }
}

// ============================================================
// MANEUVER LABEL — friendly Bulgarian text for the maneuver bubble
// ============================================================
function maneuverLabel(step){
  if(step && step.name) return step.name.toUpperCase();
  const t = (step && step.maneuver && step.maneuver.type) || '';
  const mod = (step && step.maneuver && step.maneuver.modifier) || '';
  const dirUp = (DIR_BG[mod] || '').toUpperCase();
  const lookup = {
    'depart': 'НАЧАЛО НА МАРШРУТА',
    'arrive': 'КРАЙНА ТОЧКА',
    'turn': dirUp ? 'ЗАВОЙ ' + dirUp : 'ЗАВОЙ',
    'continue': 'ПРОДЪЛЖИ НАПРАВО',
    'merge': 'ВЛИВАНЕ',
    'on ramp': 'ВХОДЯЩА РАМПА',
    'off ramp': 'ИЗХОД',
    'fork': dirUp ? 'РАЗКЛОНЕНИЕ ' + dirUp : 'РАЗКЛОНЕНИЕ',
    'end of road': 'КРАЙ НА ПЪТЯ',
    'roundabout': 'КРЪГОВО',
    'rotary': 'КРЪГОВО',
    'roundabout turn': 'КРЪГОВО',
    'new name': 'ПРОДЪЛЖИ',
    'notification': 'ПРОДЪЛЖИ'
  };
  return lookup[t] || 'ПРОДЪЛЖИ';
}

// ============================================================
// MANEUVER ICONS
// ============================================================
function maneuverIcon(m){
  if(!m) return arrowIcon('straight');
  const mod = (m.modifier||'').toLowerCase();
  const type = (m.type||'').toLowerCase();
  if(type==='arrive') return arrowIcon('arrive');
  if(type==='roundabout' || type==='rotary') return arrowIcon('roundabout');
  if(mod.includes('uturn')) return arrowIcon('uturn');
  if(mod.includes('sharp left')) return arrowIcon('sharpleft');
  if(mod.includes('sharp right')) return arrowIcon('sharpright');
  if(mod.includes('slight left')) return arrowIcon('slightleft');
  if(mod.includes('slight right')) return arrowIcon('slightright');
  if(mod.includes('left')) return arrowIcon('left');
  if(mod.includes('right')) return arrowIcon('right');
  return arrowIcon('straight');
}
function arrowIcon(kind){
  const base = (path)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`;
  switch(kind){
    case 'left':       return base('<path d="M19 12 L5 12"/><path d="M10 7 L5 12 L10 17"/>');
    case 'right':      return base('<path d="M5 12 L19 12"/><path d="M14 7 L19 12 L14 17"/>');
    case 'slightleft': return base('<path d="M18 18 L8 8"/><path d="M8 14 L8 8 L14 8"/>');
    case 'slightright':return base('<path d="M6 18 L16 8"/><path d="M10 8 L16 8 L16 14"/>');
    case 'sharpleft':  return base('<path d="M18 18 L6 6"/><path d="M6 12 L6 6 L12 6"/>');
    case 'sharpright': return base('<path d="M6 18 L18 6"/><path d="M12 6 L18 6 L18 12"/>');
    case 'uturn':      return base('<path d="M8 20 L8 9 a5 5 0 0 1 10 0 L18 20"/><path d="M4 16 L8 20 L12 16"/>');
    case 'roundabout': return base('<circle cx="12" cy="12" r="5"/><path d="M12 19 L12 14"/><path d="M9 22 L12 19 L15 22"/>');
    case 'arrive':     return base('<circle cx="12" cy="12" r="9"/><path d="M9 12 L11 14 L15 10"/>');
    default:           return base('<path d="M12 19 L12 5"/><path d="M7 10 L12 5 L17 10"/>');
  }
}

// ============================================================
// LANE GUIDANCE (OSRM step.intersections[].lanes)
// ============================================================
function updateLaneGuidance(step){
  const lanes = document.getElementById('lanes');
  if(!step || !step.intersections || !step.intersections.length){ lanes.classList.remove('show'); return; }
  // Find the first intersection in the step that has lanes
  const inter = step.intersections.find(x => x.lanes && x.lanes.length);
  if(!inter){ lanes.classList.remove('show'); return; }

  const arr = inter.lanes.map(l=>{
    const indications = l.indications || [];
    const valid = !!l.valid;
    return { indications, valid };
  });
  lanes.innerHTML = arr.map(l=>{
    const ind = l.indications[0] || 'straight';
    return `<div class="lane ${l.valid?'valid':''}">${laneArrow(ind)}</div>`;
  }).join('');
  lanes.classList.add('show');
}
function laneArrow(ind){
  const i = (ind||'').toLowerCase();
  if(i.includes('left') && i.includes('straight')) return arrowIcon('slightleft');
  if(i.includes('right') && i.includes('straight')) return arrowIcon('slightright');
  if(i==='left' || i==='sharp left') return arrowIcon('left');
  if(i==='right' || i==='sharp right') return arrowIcon('right');
  if(i==='slight left') return arrowIcon('slightleft');
  if(i==='slight right') return arrowIcon('slightright');
  if(i==='uturn') return arrowIcon('uturn');
  return arrowIcon('straight');
}

// ============================================================
// TRAFFIC SIGNALS (OSM Overpass along route)
// ============================================================
async function fetchTrafficSignals(coords){
  try {
    // Bounding box of route, slightly padded
    let minLng=Infinity, minLat=Infinity, maxLng=-Infinity, maxLat=-Infinity;
    for(const c of coords){ if(c[0]<minLng)minLng=c[0]; if(c[0]>maxLng)maxLng=c[0]; if(c[1]<minLat)minLat=c[1]; if(c[1]>maxLat)maxLat=c[1]; }
    // pad ~50m
    const padLat=0.0006, padLng=0.0008;
    const bbox = `${minLat-padLat},${minLng-padLng},${maxLat+padLat},${maxLng+padLng}`;
    if((maxLat-minLat)*(maxLng-minLng) > 0.25){
      // Too large area, skip to avoid heavy Overpass call
      return;
    }
    const q = `[out:json][timeout:10];node["highway"="traffic_signals"](${bbox});out;`;
    const r = await fetch('https://overpass-api.de/api/interpreter', {
      method:'POST', body: 'data='+encodeURIComponent(q),
      headers: {'Content-Type':'application/x-www-form-urlencoded'}
    });
    if(!r.ok) return;
    const data = await r.json();
    if(!data.elements) return;

    // Filter to signals near the route (within ~30m)
    const features = [];
    data.elements.forEach(n=>{
      if(typeof n.lat!=='number' || typeof n.lon!=='number') return;
      const p = [n.lon, n.lat];
      // distance to nearest route point
      let dMin = Infinity;
      for(let i=0;i<coords.length;i+=3){
        const d = haversine(p, coords[i]);
        if(d < dMin) dMin = d;
      }
      if(dMin < 35) features.push({ type:'Feature', geometry:{type:'Point', coordinates:p}, properties:{} });
    });

    const geojson = { type:'FeatureCollection', features };
    if(map.getSource('signals')){
      map.getSource('signals').setData(geojson);
    } else {
      map.addSource('signals', { type:'geojson', data: geojson });
      map.addLayer({
        id:'signals', type:'circle', source:'signals',
        paint:{
          'circle-radius': ['interpolate',['linear'],['zoom'], 12, 2, 16, 5, 18, 8],
          'circle-color':'#ff6b00',
          'circle-stroke-color':'#fff',
          'circle-stroke-width':1.2,
          'circle-opacity':0.95
        }
      });
    }
  } catch(e){ console.warn('signals fetch failed', e); }
}

// ============================================================
// HAVERSINE
// ============================================================
function haversine(a, b){
  const toRad = x => x*Math.PI/180;
  const R = 6371000;
  const dLat = toRad(b[1]-a[1]);
  const dLng = toRad(b[0]-a[0]);
  const lat1 = toRad(a[1]), lat2 = toRad(b[1]);
  const x = Math.sin(dLat/2)**2 + Math.sin(dLng/2)**2 * Math.cos(lat1)*Math.cos(lat2);
  return 2*R*Math.asin(Math.sqrt(x));
}

});

});

});
document.querySelectorAll('.modal-opt').forEach(opt=>{
  opt.addEventListener('click', ()=>{
    const kind = opt.dataset.save;
    if(!destination) return;
    const item = { lng:destination[0], lat:destination[1], name:destinationName||'' };
    if(kind==='home'){ LS.set('mbux-home', item); toast('Запазено като Дом'); }
    else if(kind==='work'){ LS.set('mbux-work', item); toast('Запазено като Работа'); }

  });
});
